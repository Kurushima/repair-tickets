x-app-environment: &app-environment
  DATABASE_URL: postgres://repair:repair_local_dev@postgres:5432/repair_tickets?sslmode=disable
  RABBITMQ_URL: amqp://repair:repair_rabbit_local@rabbitmq:5672/%2F

services:
  api:
    build: .
    image: repair-tickets:local
    environment:
      <<: *app-environment
      HTTP_ADDR: 0.0.0.0:8080
      KEYDB_ADDR: keydb:6379
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keydb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    image: repair-tickets:local
    pull_policy: never
    entrypoint: ["/app/worker"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: repair_tickets
      POSTGRES_USER: repair
      POSTGRES_PASSWORD: repair_local_dev
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-tickets.sql:ro
      - ./db/002-outbox.sql:/docker-entrypoint-initdb.d/002-outbox.sql:ro
      - ./db/003-history.sql:/docker-entrypoint-initdb.d/003-history.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "repair", "-d", "repair_tickets"]
      interval: 5s
      timeout: 3s
      retries: 12

  keydb:
    image: eqalpha/keydb:x86_64_v6.3.4
    command: ["keydb-server", "--protected-mode", "no", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "keydb-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:4.3.4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: repair
      RABBITMQ_DEFAULT_PASS: repair_rabbit_local
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
  rabbitmq-data:
